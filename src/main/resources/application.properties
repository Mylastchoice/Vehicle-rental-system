# Server & Application
server.port=8080
spring.application.name=vehicle-rental-system

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/vehicle_rental_system
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Flyway
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=2
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}

# Cấu hình SMTP Gmail qua biến môi trường để gửi liên kết đặt lại mật khẩu (UC05)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Tin cậy header từ Dev Tunnels / Proxy để redirect đúng domain
server.forward-headers-strategy=native

morrow.stripe.secret-key=${MORROW_STRIPE_SECRET_KEY:}
morrow.stripe.webhook-secret=${MORROW_STRIPE_WEBHOOK_SECRET:}
morrow.stripe.app-origin=${MORROW_STRIPE_APP_ORIGIN:http://localhost:8080}
