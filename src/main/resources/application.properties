spring.application.name=vehicle-rental-system

# Port
server.port=${PORT:8080}

# PostgreSQL - every value can be overridden by an environment variable (see README)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vehicle_rental_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# JPA: the schema is owned by Flyway, Hibernate never changes it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=1
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
server.forward-headers-strategy=framework