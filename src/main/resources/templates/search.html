<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Tìm xe</title></head>
<body>
<h1>Kết quả tìm kiếm</h1>
<p th:if="${error}" th:text="${error}" style="color:red"></p>
<form action="/vehicles/search" method="get">
    <input name="keyword" th:value="${keyword}" placeholder="Tên hoặc mã xe">
    <label>Ngày nhận <input type="date" name="pickupDate" th:value="${pickupDate}"></label>
    <label>Ngày trả <input type="date" name="returnDate" th:value="${returnDate}"></label>
    <button type="submit">Tìm</button>
</form>
<p><strong>Lưu ý:</strong> Kết quả hiện tìm theo tên/mã xe. Kiểm tra xe trống theo ngày cần tích hợp AvailabilityService của M3.</p>
<ul>
    <li th:each="v : ${vehicles.content}">
        <a th:href="@{/vehicles/{id}(id=${v.id})}" th:text="${v.name}"></a>
        - <span th:text="${v.pricePerDay}"></span>
    </li>
</ul>
<a href="/vehicles">Quay lại</a>
</body></html>
