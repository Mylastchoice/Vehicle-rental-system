<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - Morrow</title>
  <link rel="stylesheet" href="../../static/css/auth.css" th:href="@{/css/auth.css}" />
</head>
<body>
  <main class="card">
    <div class="header">
      <a href="/" class="logo">
        <span class="logo-mark"></span>
        <span>Morrow</span>
      </a>
      <a href="/" class="back-link">&larr; Back to homepage</a>
    </div>

    <h1 class="title">Sign in</h1>

    <div th:if="${serverError}" th:text="${serverError}" class="alert-banner"></div>
    <div th:if="${successMessage}" th:text="${successMessage}" class="alert-success"></div>

    <form th:action="@{/login}" method="post">
      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" type="email" id="email" name="email" th:value="${email}" placeholder="minh.nguyen@gmail.com" required />
      </div>

      <div class="field field-last">
        <label class="label" for="password">Password</label>
        <div class="input-box">
          <input class="input input-pwd" th:classappend="${serverError} ? 'input-error'" type="password" id="password" name="password" placeholder="••••••••••" required />
          <button type="button" class="eye-btn" onclick="togglePassword('password')" aria-label="Toggle password">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="forgot-wrap">
        <a href="forgot-password.html" th:href="@{/forgot-password}" class="underline-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit">Sign in &rarr;</button>
    </form>

    <div class="switch-text">
      Don&rsquo;t have an account? <a href="register.html" th:href="@{/register}">Sign up</a>
    </div>

    <footer class="footer">
      <span>&copy; 2026 Morrow</span>
      <nav class="footer-nav">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
      </nav>
    </footer>
  </main>

  <script src="../../static/js/auth.js" th:src="@{/js/auth.js}"></script>
</body>
</html>
