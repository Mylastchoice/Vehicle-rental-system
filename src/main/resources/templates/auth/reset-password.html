<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set new password - Morrow</title>
  <link rel="stylesheet" href="../../static/css/auth.css" th:href="@{/css/auth.css}" />
</head>
<body>
  <main class="card">
    <div class="header">
      <a href="/" class="logo">
        <span class="logo-mark"></span>
        <span>Morrow</span>
      </a>
      <a href="/" class="back-link">&larr; Back to homepage</a>
    </div>

    <h1 class="title title-tight">Set new password</h1>
    <p class="subtitle">Create a new password for your account.</p>

    <div th:if="${tokenError}" th:text="${tokenError}" class="alert-banner"></div>
    <div th:if="${serverError}" th:text="${serverError}" class="alert-banner"></div>

    <form id="resetForm" th:action="@{/reset-password}" method="post" novalidate>
      <input type="hidden" name="token" th:value="${token}" />

      <div class="field">
        <label class="label" for="newPassword">New password</label>
        <div class="input-box">
          <input class="input input-pwd" type="password" id="newPassword" name="newPassword" placeholder="••••••••••" required />
          <button type="button" class="eye-btn" onclick="togglePassword('newPassword')" aria-label="Toggle password">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span id="newPwdError" class="error-msg">Password must be at least 8 characters and include letters and numbers.</span>
      </div>

      <div class="field">
        <label class="label" for="confirmPassword">Confirm new password</label>
        <div class="input-box">
          <input class="input input-pwd" type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••••" required />
          <button type="button" class="eye-btn" onclick="togglePassword('confirmPassword')" aria-label="Toggle confirm password">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span id="confirmNewPwdError" class="error-msg">Passwords do not match</span>
      </div>

      <button type="submit" class="btn-submit">Update password &rarr;</button>
    </form>

    <div class="switch-text">
      <a href="login.html" th:href="@{/login}" class="no-gap">Back to log in</a>
    </div>

    <footer class="footer">
      <span>&copy; 2026 Morrow</span>
      <nav class="footer-nav">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
      </nav>
    </footer>
  </main>

  <script src="../../static/js/auth.js" th:src="@{/js/auth.js}"></script>
</body>
</html>
