<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create an account - Morrow</title>
  <link rel="stylesheet" href="../../static/css/auth.css" th:href="@{/css/auth.css}" />
</head>
<body>
  <main class="card">
    <div class="header">
      <a href="/" class="logo">
        <span class="logo-mark"></span>
        <span>Morrow</span>
      </a>
      <a href="/" class="back-link">&larr; Back to homepage</a>
    </div>

    <h1 class="title">Create an account</h1>

    <div th:if="${serverError}" th:text="${serverError}" class="alert-banner"></div>

    <form id="registerForm" th:action="@{/register}" method="post" novalidate>
      <div class="field">
        <label class="label" for="fullName">Full name</label>
        <input class="input" type="text" id="fullName" name="fullName" placeholder="Nguyen Minh" required />
        <span id="fullNameError" class="error-msg">Full name is required</span>
      </div>

      <div class="field">
        <label class="label" for="phone">Phone number</label>
        <input class="input" type="tel" id="phone" name="phone" placeholder="+84 912 345 678" required />
        <span id="phoneError" class="error-msg">Please enter a valid Vietnamese phone number</span>
      </div>

      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" type="email" id="email" name="email" placeholder="minh.nguyen@example.com" required />
        <span id="emailError" class="error-msg">Please enter a valid email address</span>
      </div>

      <div class="field">
        <label class="label" for="password">Password</label>
        <div class="input-box">
          <input class="input input-pwd" type="password" id="password" name="password" placeholder="••••••••••" required />
          <button type="button" class="eye-btn" onclick="togglePassword('password')" aria-label="Toggle password">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span id="passwordError" class="error-msg">Password must be at least 6 characters</span>
      </div>

      <div class="field">
        <label class="label" for="confirmPassword">Confirm password</label>
        <div class="input-box">
          <input class="input input-pwd" type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required />
          <button type="button" class="eye-btn" onclick="togglePassword('confirmPassword')" aria-label="Toggle confirm password">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span id="confirmError" class="error-msg">Passwords do not match</span>
      </div>

      <div class="field">
        <label class="label" for="captchaInput">
          CAPTCHA (<span th:text="${captchaCauHoi}">3 + 4 = ?</span>)
        </label>
        <input class="input" type="text" id="captchaInput" name="captchaInput" placeholder="Nhap ket qua phep tinh" required />
      </div>

      <button type="submit" class="btn-submit">Sign up &rarr;</button>
    </form>

    <div class="switch-text">
      Already have an account? <a href="login.html" th:href="@{/login}">Log in</a>
    </div>

    <footer class="footer">
      <span>&copy; 2026 Morrow</span>
      <nav class="footer-nav">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
      </nav>
    </footer>
  </main>

  <script src="../../static/js/auth.js" th:src="@{/js/auth.js}"></script>
</body>
</html>
