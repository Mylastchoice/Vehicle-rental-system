<!DOCTYPE html>
<!-- Khai báo namespace Thymeleaf để dùng các thuộc tính động -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password - Morrow</title>
  <!-- Dùng đường dẫn tương đối @{/css/auth.css} để tải đúng CSS -->
  <link rel="stylesheet" href="../../static/css/auth.css" th:href="@{/css/auth.css}" />
</head>
<body>
  <main class="card">
    <!-- Header điều hướng về trang chủ bằng đường dẫn tương đối -->
    <div class="header">
      <a href="/" th:href="@{/}" class="logo">
        <span class="logo-mark"></span>
        <span>Morrow</span>
      </a>
      <a href="/" th:href="@{/}" class="back-link">&larr; Back to homepage</a>
    </div>

    <h1 class="title title-tight">Reset password</h1>
    <p class="subtitle">Enter your email address to receive a password reset link.</p>

    <!-- Chỉ hiển thị một thông báo chung, không hiển thị link reset trên giao diện -->
    <div th:if="${successMessage}" class="alert-success">
      <span th:text="${successMessage}"></span>
    </div>

    <!-- Form gửi yêu cầu quên mật khẩu tới POST /forgot-password -->
    <form id="forgotForm" th:action="@{/forgot-password}" method="post" novalidate>
      <div class="field">
        <label class="label" for="email">Email</label>
        <!-- Giữ lại giá trị email đã nhập khi có lỗi từ server -->
        <input class="input" th:classappend="${emailError} ? 'input-error'" type="email" id="email" name="email" th:value="${email}" placeholder="name@example.com" required />
        <!-- Lỗi kiểm tra định dạng phía trình duyệt -->
        <span id="emailError" class="error-msg">Please enter a valid email address.</span>
        <!-- Lỗi trả về từ controller phía server -->
        <span th:if="${emailError}" th:text="${emailError}" class="server-error">Please enter a valid email address.</span>
      </div>

      <button type="submit" class="btn-submit">Send reset link &rarr;</button>
    </form>

    <!-- Quay lại trang đăng nhập bằng đường dẫn tương đối -->
    <div class="switch-text">
      <a href="login.html" th:href="@{/login}" class="no-gap">Back to log in</a>
    </div>

    <footer class="footer">
      <span>&copy; 2026 Morrow</span>
      <nav class="footer-nav">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
      </nav>
    </footer>
  </main>

  <!-- Tải file JS kiểm tra định dạng email phía trình duyệt -->
  <script src="../../static/js/auth.js" th:src="@{/js/auth.js}"></script>
</body>
</html>
