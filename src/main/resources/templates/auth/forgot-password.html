<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password - Morrow</title>
  <link rel="stylesheet" href="../../static/css/auth.css" th:href="@{/css/auth.css}" />
</head>
<body>
  <main class="card">
    <div class="header">
      <a href="/" class="logo">
        <span class="logo-mark"></span>
        <span>Morrow</span>
      </a>
      <a href="/" class="back-link">&larr; Back to homepage</a>
    </div>

    <h1 class="title title-tight">Reset password</h1>
    <p class="subtitle">Enter your email address to receive a password reset link.</p>

    <div th:if="${successMessage}" class="alert-success">
      <span th:text="${successMessage}"></span>
      <div th:if="${resetLink}" style="margin-top: 8px;">
        <a th:href="@{${resetLink}}" th:text="${resetLink}" class="underline-link">Reset link</a>
      </div>
    </div>

    <form id="forgotForm" th:action="@{/forgot-password}" method="post" novalidate>
      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" th:classappend="${emailError} ? 'input-error'" type="email" id="email" name="email" th:value="${email}" placeholder="name@example.com" required />
        <span id="emailError" class="error-msg">Invalid or unregistered email address</span>
        <span th:if="${emailError}" th:text="${emailError}" class="server-error">Invalid or unregistered email address</span>
      </div>

      <button type="submit" class="btn-submit">Send reset link &rarr;</button>
    </form>

    <div class="switch-text">
      <a href="login.html" th:href="@{/login}" class="no-gap">Back to log in</a>
    </div>

    <footer class="footer">
      <span>&copy; 2026 Morrow</span>
      <nav class="footer-nav">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
      </nav>
    </footer>
  </main>

  <script src="../../static/js/auth.js" th:src="@{/js/auth.js}"></script>
</body>
</html>
