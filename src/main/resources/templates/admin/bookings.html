<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị Booking - MORROW Admin</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div class="container">
    <h2>Quản lý đơn thuê xe (Admin)</h2>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/admin/bookings}" method="get" class="filter-bar">
        <select name="status">
            <option value="">-- Tất cả trạng thái --</option>
            <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"
                    th:selected="${st == selectedStatus}"></option>
        </select>
        <input type="date" name="fromDate" th:value="${param.fromDate}">
        <input type="date" name="toDate" th:value="${param.toDate}">
        <button type="submit" class="btn">Lọc</button>
    </form>

    <table class="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Khách hàng</th>
            <th>Thời gian thuê</th>
            <th>Tổng / Cọc</th>
            <th>Trạng thái hiện tại</th>
            <th>Chuyển trạng thái</th>
            <th>Audit</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${bookings.content}">
            <td th:text="'#' + ${b.id}"></td>
            <td th:text="${b.user.email}"></td>
            <td th:text="${#temporals.format(b.pickupDate, 'dd/MM HH:mm')} + ' → ' + ${#temporals.format(b.returnDate, 'dd/MM HH:mm')}"></td>
            <td th:text="${b.totalAmount} + ' / ' + ${b.depositAmount}"></td>
            <td><strong th:text="${b.status}"></strong></td>
            <td>
                <form th:if="${b.status.name() != 'COMPLETED' && b.status.name() != 'CANCELLED'}"
                      th:action="@{/admin/bookings/{id}/status(id=${b.id})}" method="post">
                    <select name="targetStatus">
                        <option th:if="${b.status.name() == 'PENDING'}" value="CONFIRMED">CONFIRMED</option>
                        <option th:if="${b.status.name() == 'CONFIRMED'}" value="PICKED_UP">PICKED_UP</option>
                        <option th:if="${b.status.name() == 'PICKED_UP'}" value="COMPLETED">COMPLETED</option>
                        <option th:if="${b.status.name() == 'PENDING' || b.status.name() == 'CONFIRMED'}" value="CANCELLED">CANCELLED</option>
                    </select>
                    <input type="text" name="note" placeholder="Ghi chú...">
                    <button type="submit" class="btn btn-sm">Cập nhật</button>
                </form>
            </td>
            <td>
                <a th:href="@{/admin/bookings/{id}/history(id=${b.id})}">Lịch sử</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
