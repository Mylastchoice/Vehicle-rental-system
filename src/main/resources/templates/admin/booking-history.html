<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử trạng thái đơn thuê - MORROW Admin</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div class="container">
    <h2>Nhật ký thay đổi trạng thái đơn <span th:text="'#' + ${bookingId}"></span></h2>

    <table class="table">
        <thead>
        <tr>
            <th>Thời gian</th>
            <th>Trạng thái cũ</th>
            <th>Trạng thái mới</th>
            <th>ID Người thực hiện</th>
            <th>Ghi chú</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${historyList}">
            <td th:text="${#temporals.format(h.changedAt, 'dd/MM/yyyy HH:mm:ss')}"></td>
            <td th:text="${h.oldStatus}"></td>
            <td><strong th:text="${h.newStatus}"></strong></td>
            <td th:text="${h.changedByUserId}"></td>
            <td th:text="${h.note}"></td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/admin/bookings}" class="btn">← Quay lại danh sách quản trị</a>
</div>
</body>
</html>
