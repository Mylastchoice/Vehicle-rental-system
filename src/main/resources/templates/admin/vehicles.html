<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Quản lý xe</title></head>
<body>
<h1>Quản lý xe</h1>
<p th:if="${success}" th:text="${success}" style="color:green"></p>
<p th:if="${error}" th:text="${error}" style="color:red"></p>
<a href="/admin/vehicles/new">Thêm xe</a> | <a href="/admin/users">Quản lý người dùng</a>
<table border="1">
<tr><th>Mã</th><th>Tên xe</th><th>Giá/ngày</th><th>Trạng thái</th><th>Thao tác</th></tr>
<tr th:each="v : ${vehicles}">
<td th:text="${v.vehicleCode}"></td><td th:text="${v.name}"></td>
<td th:text="${v.pricePerDay}"></td>
<td th:text="${v.active ? 'Đang hoạt động' : 'Ngừng hoạt động'}"></td>
<td>
<a th:href="@{/admin/vehicles/{id}/edit(id=${v.id})}">Sửa</a>
<form th:if="${v.active}" th:action="@{/admin/vehicles/{id}/delete(id=${v.id})}" method="post" style="display:inline">
<button type="submit" onclick="return confirm('Ngừng hoạt động xe này?')">Ngừng hoạt động</button>
</form>
</td></tr></table>
</body></html>
