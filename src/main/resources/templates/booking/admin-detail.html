<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MORROW - Manage booking</title>
<link rel="stylesheet" th:href="@{/rental/style.css}"><style>main{max-width:900px;margin:45px auto;padding:24px}.panel{background:white;padding:24px;border-radius:12px;margin-bottom:20px}button{padding:10px 18px}table{width:100%}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}</style></head>
<body><main><p><a th:href="@{/admin/bookings}">All bookings</a> / Details</p>
<h1 th:text="${'Booking #' + detail.booking.bookingId}"></h1><p th:if="${message}" th:text="${message}"></p>
<div class="panel"><p>Member ID: <span th:text="${detail.booking.userId}"></span></p><p>Status: <b th:text="${detail.booking.status}"></b></p>
<p>Pickup: <span th:text="${detail.booking.pickupDate}"></span> at <span th:text="${detail.booking.pickupLocation}"></span></p>
<p>Scheduled return: <span th:text="${detail.booking.returnDate}"></span></p>
<p th:if="${detail.booking.requestedReturnDate}">Requested early return: <span th:text="${detail.booking.requestedReturnDate}"></span></p>
<p th:if="${detail.booking.actualReturnDate}">Actual return: <span th:text="${detail.booking.actualReturnDate}"></span></p>
<p>Total: <span th:text="${detail.booking.totalAmount}"></span> VND; deposit (30%): <span th:text="${detail.booking.depositAmount}"></span> VND</p>
<p>Remaining balance (70%): <b th:text="${(detail.booking.totalAmount != null and detail.booking.depositAmount != null) ? detail.booking.totalAmount.subtract(detail.booking.depositAmount) : 0} + ' VND'"></b></p>
<p>Payment method: <span th:text="${detail.booking.paymentMethod}"></span></p>
<p th:if="${depositStatus}">Sandbox deposit status: <b th:text="${depositStatus}"></b></p>
<h2>Vehicles</h2><table><tr><th>Code</th><th>Dates</th><th>Subtotal</th></tr>
<tr th:each="v : ${detail.vehicles}"><td th:text="${v.vehicleCode}"></td><td th:text="|${v.pickupDate} – ${v.returnDate}|"></td><td th:text="${v.subtotal}"></td></tr></table></div>
<form th:if="${detail.booking.status == 'Pending' or detail.booking.status == 'Confirmed' or detail.booking.status == 'Picked up'}"
      th:action="@{/admin/bookings/{id}/status(id=${detail.booking.bookingId})}" method="post">
<label>New status <select name="status" required>
<option th:if="${detail.booking.status == 'Pending' and (detail.booking.paymentMethod != 'ONLINE' or depositStatus == 'Paid')}" value="CONFIRMED">Confirm</option>
<option th:if="${detail.booking.status == 'Pending' or detail.booking.status == 'Confirmed'}" value="CANCELLED">Cancel</option>
<option th:if="${detail.booking.status == 'Confirmed'}" value="PICKED_UP">Record pickup</option>
<option th:if="${detail.booking.status == 'Picked up'}" value="COMPLETED"
        th:text="${detail.booking.requestedReturnDate == null ? 'Record immediate return' : 'Confirm vehicle returned'}">Record immediate return</option>
</select></label> <button type="submit">Update status</button></form>
</main></body></html>
