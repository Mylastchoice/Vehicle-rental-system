<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MORROW - My bookings</title>
  <link rel="stylesheet" th:href="@{/rental/style.css}">
  <style>main{max-width:1000px;margin:45px auto;padding:24px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}a{color:#1459a8}.empty{padding:40px;text-align:center;background:white}.pager{display:flex;gap:15px;margin-top:20px}</style>
</head>
<body><main>
  <p><a th:href="@{/rental/index.html}">Home</a> / My bookings</p>
  <h1>My bookings</h1>
  <div class="empty" th:if="${#lists.isEmpty(history.items)}">No bookings yet</div>
  <table th:unless="${#lists.isEmpty(history.items)}">
    <thead><tr><th>Booking</th><th>Pickup</th><th>Return</th><th>Total (VND)</th><th>Status</th><th></th></tr></thead>
    <tbody><tr th:each="b : ${history.items}">
      <td th:text="${'#' + b.bookingId}"></td><td th:text="${b.pickupDate}"></td>
      <td th:text="${b.returnDate}"></td><td th:text="${b.totalAmount}"></td>
      <td th:text="${b.status}"></td><td><a th:href="@{/bookings/{id}(id=${b.bookingId})}">Details</a></td>
    </tr></tbody>
  </table>
  <div class="pager">
    <a th:if="${history.hasPrevious()}" th:href="@{/bookings(page=${history.page - 1})}">Previous</a>
    <span th:text="${'Page ' + (history.page + 1) + ' of ' + history.totalPages}"></span>
    <a th:if="${history.hasNext()}" th:href="@{/bookings(page=${history.page + 1})}">Next</a>
  </div>
</main></body></html>
