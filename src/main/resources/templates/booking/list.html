<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử thuê xe - MORROW</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div class="container">
    <h2>Lịch sử đặt xe của tôi</h2>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <table class="table">
        <thead>
        <tr>
            <th>Mã đơn</th>
            <th>Ngày nhận</th>
            <th>Ngày trả</th>
            <th>Chi nhánh nhận</th>
            <th>Tổng tiền</th>
            <th>Tiền cọc (30%)</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${bookings.content}">
            <td th:text="'#' + ${b.id}"></td>
            <td th:text="${#temporals.format(b.pickupDate, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${#temporals.format(b.returnDate, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${b.pickupBranch.name}"></td>
            <td th:text="${#numbers.formatDecimal(b.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
            <td th:text="${#numbers.formatDecimal(b.depositAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
            <td><span class="badge" th:text="${b.status}"></span></td>
            <td>
                <a th:href="@{/bookings/{id}(id=${b.id})}" class="btn btn-sm">Chi tiết</a>
                <form th:if="${b.status.name() == 'PENDING' || b.status.name() == 'CONFIRMED'}"
                      th:action="@{/bookings/{id}/cancel(id=${b.id})}" method="post" style="display:inline;"
                      onsubmit="return confirm('Xác nhận hủy đơn này? Hoàn 100% cọc nếu hủy trước giờ nhận >= 24h.');">
                    <button type="submit" class="btn btn-danger btn-sm">Hủy đơn</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${bookings.totalPages > 1}">
        <a th:if="${bookings.hasPrevious()}" th:href="@{/bookings(page=${bookings.number - 1})}">Trang trước</a>
        <span th:text="'Trang ' + (${bookings.number + 1}) + ' / ' + ${bookings.totalPages}"></span>
        <a th:if="${bookings.hasNext()}" th:href="@{/bookings(page=${bookings.number + 1})}">Trang sau</a>
    </div>
</div>
</body>
</html>
